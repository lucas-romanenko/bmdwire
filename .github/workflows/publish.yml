# Publish ONE package to PyPI per tag, via trusted publishing (OIDC): no API
# token lives in this repository.
#
# ON PYPI.ORG, ONCE PER PROJECT (manual): each of the four projects —
# atemwire, hyperdeckwire, ultimattewire, videohubwire — has a trusted
# publisher that still points at its old repository. Update (or add) each
# one to owner lucas-romanenko, repository bmdwire, workflow publish.yml,
# environment pypi. Until that is done PyPI refuses uploads from here.
#
# Tags are <package>-v<version>: atemwire-v0.15.0.dev0, hyperdeckwire-v0.1.0.dev0,
# ultimattewire-v0.1.0.dev0, videohubwire-v0.1.0.dev0. The workflow parses the
# tag, refuses anything else, checks the version against that package's
# pyproject.toml, builds only that package and publishes it. atemwire ships
# an sdist plus prebuilt wheels (cibuildwheel: Linux x86_64 and aarch64,
# macOS arm64 and x86_64, Windows x86_64, CPython 3.10–3.14) so a pip
# install never needs a C compiler; the others ship sdist + wheel. Re-publish an existing tag with "Run workflow" and the tag
# name. A GitHub release for the tag triggers it too.
name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, <package>-v<version> (e.g. atemwire-v0.15.0.dev0)"
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ github.event.inputs.tag || github.ref_name }}
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.parse.outputs.package }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Parse the tag into package and version
        id: parse
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          case "$TAG" in
            atemwire-v?*|hyperdeckwire-v?*|ultimattewire-v?*|videohubwire-v?*) ;;
            *) echo "::error::tag '$TAG' is not <package>-v<version> for one of the four packages"; exit 1 ;;
          esac
          package="${TAG%%-v*}"
          version="${TAG#*-v}"
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG package=$package version=$version"
      - name: Tag version matches the package's pyproject version
        working-directory: ${{ steps.parse.outputs.package }}
        env:
          TAG_VERSION: ${{ steps.parse.outputs.version }}
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          echo "tag version=$TAG_VERSION pyproject version=$version"
          test "$TAG_VERSION" = "$version"
      - name: Build the distribution
        working-directory: ${{ steps.parse.outputs.package }}
        env:
          PACKAGE: ${{ steps.parse.outputs.package }}
        run: |
          pip install build
          if [ "$PACKAGE" = "atemwire" ]; then
            python -m build --sdist
          else
            python -m build
          fi
          ls -l dist/
      - name: Check the distributions
        working-directory: ${{ steps.parse.outputs.package }}
        run: |
          pip install twine
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: ${{ steps.parse.outputs.package }}/dist/

  # atemwire only: binary wheels for the C extension, one runner per
  # platform (the macOS runner cross-compiles the x86_64 wheel as well).
  wheels:
    name: atemwire wheels on ${{ matrix.os }}
    needs: build
    if: needs.build.outputs.package == 'atemwire'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: pypa/cibuildwheel@v4.2.1
        with:
          package-dir: atemwire
          output-dir: wheelhouse
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "pp* *-musllinux_*"
          CIBW_ARCHS_MACOS: "arm64 x86_64"
          CIBW_TEST_COMMAND: python -c "import atemwire.mediaconvert"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  publish:
    name: Publish to PyPI
    needs: [build, wheels]
    # Runs after the sdist and, for atemwire, the wheels; the wheels job is
    # skipped for the other packages and that must not block them.
    if: always() && needs.build.result == 'success' && (needs.wheels.result == 'success' || needs.wheels.result == 'skipped')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v4
        if: needs.wheels.result == 'success'
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/
      - name: What is being published
        run: ls -l dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A manual "Run workflow" on a tag that is already on PyPI is a
          # no-op (the way to prove the publisher is wired without a new
          # version). A release-triggered run keeps failing on a duplicate,
          # so a tag made without a version bump is caught loudly.
          skip-existing: ${{ github.event_name == 'workflow_dispatch' }}
