# Publish bmdwire to PyPI, via trusted publishing (OIDC): no API token lives
# in this repository.
#
# ON PYPI.ORG, ONCE (manual): the project `bmdwire` needs a trusted
# publisher — owner lucas-romanenko, repository bmdwire, workflow
# publish.yml, environment pypi. Until the project has its first release
# that is a "pending publisher" added from the account's Publishing page.
# Until it exists PyPI refuses the upload. The four old projects (atemwire,
# hyperdeckwire, ultimattewire, videohubwire) keep their last 1.0.x
# release and are not published from here any more.
#
# A release is a tag `v<version>` on main whose version equals
# `project.version` in pyproject.toml; the tag PUSH starts this workflow
# (a GitHub release created afterwards with `gh release edit` / `gh
# release create` on the existing tag does not start a second run). The
# sdist is built once; cibuildwheel builds the wheels — atemwire's C
# extension makes the whole distribution platform-specific — for Linux
# x86_64 and aarch64, macOS arm64 and x86_64, Windows x86_64 on CPython
# 3.10–3.14, so a pip install never needs a compiler. Re-publish an
# existing tag with "Run workflow" and the tag name.
#
# Once the release is on PyPI, `port-issue` opens "Port bmdwire v<version>"
# in bmdctl, the Go port, with the release notes (see the job). It needs
# the repository secret BMDCTL_ISSUE_TOKEN, and the GitHub release made
# within 30 minutes of the publish finishing.
name: Publish to PyPI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, v<version> (e.g. v1.1.0)"
        required: true

permissions:
  contents: read

jobs:
  sdist:
    name: sdist for ${{ github.event.inputs.tag || github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag version matches pyproject.toml
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "::error::tag '$TAG' is not v<version>"; exit 1 ;;
          esac
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          echo "tag=$TAG pyproject version=$version"
          test "${TAG#v}" = "$version"
      - name: Build the sdist
        run: |
          pip install build twine
          python -m build --sdist
          twine check dist/*
          ls -l dist/
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/

  wheels:
    name: wheels on ${{ matrix.os }}
    needs: sdist
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: pypa/cibuildwheel@v4.2.1
        with:
          output-dir: wheelhouse
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "pp* *-musllinux_*"
          CIBW_ARCHS_MACOS: "arm64 x86_64"
          CIBW_TEST_COMMAND: python -c "import atemwire.mediaconvert, hyperdeckwire, ultimattewire, videohubwire"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  publish:
    name: Publish to PyPI
    needs: [sdist, wheels]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/
      - name: What is being published
        run: ls -l dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A manual "Run workflow" on a tag that is already on PyPI is a
          # no-op (the way to prove the publisher is wired without a new
          # version). A tag-triggered run keeps failing on a duplicate, so
          # a tag made without a version bump is caught loudly.
          skip-existing: ${{ github.event_name == 'workflow_dispatch' }}

  # bmdctl (github.com/lucas-romanenko/bmdctl, private) is the Go port of
  # this library. Once a release is on PyPI, open "Port bmdwire v<version>"
  # there, labelled `port`, whose body is the release's notes and a link
  # to it; skip if an issue of that title exists already, open or closed.
  # The notes' bare #N become lucas-romanenko/bmdwire#N, since in bmdctl
  # #N is bmdctl's own. The GitHub release is made by hand after this
  # workflow (see the top), so the job waits up to 30 minutes for it, then
  # fails: make the release and re-run the job. BMDCTL_ISSUE_TOKEN is a
  # fine-grained token with access to lucas-romanenko/bmdctl only and
  # Issues: read and write (Metadata: read comes with it).
  port-issue:
    name: Port issue in bmdctl
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      TITLE: Port bmdwire ${{ github.event.inputs.tag || github.ref_name }}
      BMDCTL: lucas-romanenko/bmdctl
    steps:
      - name: Look for the issue in bmdctl
        id: existing
        env:
          GH_TOKEN: ${{ secrets.BMDCTL_ISSUE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::the repository secret BMDCTL_ISSUE_TOKEN is not set"
            exit 1
          fi
          url=$(gh api --paginate "repos/$BMDCTL/issues?state=all&per_page=100" \
            --jq '.[] | select(.pull_request == null and .title == env.TITLE) | .html_url' | sed -n 1p)
          if [ -n "$url" ]; then
            echo "\"$TITLE\" exists already: $url" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Wait for the GitHub release
        if: steps.existing.outputs.found == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 60); do
            if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > release.json 2> error.txt; then
              exit 0
            fi
            if ! grep -q 'HTTP 404' error.txt; then
              cat error.txt >&2
              exit 1
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "::error::no GitHub release for $TAG after 30 minutes: make it, then re-run this job"
              exit 1
            fi
            echo "no release for $TAG yet; waiting"
            sleep 30
          done
      - name: Open the issue
        if: steps.existing.outputs.found == 'false'
        env:
          GH_TOKEN: ${{ secrets.BMDCTL_ISSUE_TOKEN }}
        run: |
          {
            printf '[bmdwire %s](%s) is on PyPI. Its release notes:\n\n' "$TAG" "$(jq -r .html_url release.json)"
            jq -r '.body // ""' release.json |
              perl -pe 's{(?<![\w/&#])#(\d+)\b}{lucas-romanenko/bmdwire#$1}g'
          } > body.md
          if ! gh api "repos/$BMDCTL/labels/port" --silent 2> /dev/null; then
            gh api "repos/$BMDCTL/labels" --silent -f name=port -f color=9A9E9F \
              -f description="A bmdwire release or change to port"
          fi
          url=$(gh api "repos/$BMDCTL/issues" -f title="$TITLE" -F body=@body.md \
            -f 'labels[]=port' --jq .html_url)
          echo "Opened $url" | tee -a "$GITHUB_STEP_SUMMARY"
