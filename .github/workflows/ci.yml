# One distribution, one suite: the four packages' tests run together from
# the repository root (pytest.ini lists them), on three Pythons, for every
# push and pull request. The editable install builds atemwire's C extension
# in place with the runner's gcc, which the source tree needs to import.
#
# The `build` job proves the metadata: an sdist and a wheel that pass
# `twine check`, so a licence-expression or manifest mistake shows up on
# the pull request rather than on the tag.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install editable with the test extras
        run: pip install -e ".[test]"
      - name: Test
        run: python -m pytest -q

  build:
    name: sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: The wheel installs and every package imports
        run: |
          pip install dist/*.whl
          cd /tmp && python -c "import atemwire.mediaconvert, hyperdeckwire, ultimattewire, videohubwire; print('ok')"

  # One check with a fixed name for branch protection to require; green only
  # when every matrix entry and the build passed.
  result:
    name: CI result
    needs: [test, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          TESTS: ${{ needs.test.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          echo "tests=$TESTS build=$BUILD"
          test "$TESTS" = "success" && test "$BUILD" = "success"
