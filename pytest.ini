[pytest]
# The four suites, run together from the repository root, and tools/ (the
# bench scripts: parsed, never run against a device). `pip install -e
# ".[test]"` first: the editable install builds atemwire's C extension in
# place, which the source tree needs to import.
testpaths =
    atemwire/tests
    hyperdeckwire/tests
    ultimattewire/tests
    videohubwire/tests
    tools
# pytest-timeout: a hung test fails instead of hanging the run.
timeout = 60
