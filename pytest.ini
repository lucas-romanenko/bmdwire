[pytest]
# The four suites, run together from the repository root. `pip install -e
# ".[test]"` first: the editable install builds atemwire's C extension in
# place, which the source tree needs to import.
testpaths =
    atemwire/tests
    hyperdeckwire/tests
    ultimattewire/tests
    videohubwire/tests
# pytest-timeout: a hung test fails instead of hanging the run.
timeout = 60
