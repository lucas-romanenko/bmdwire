[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperdeckwire"
version = "0.1.0.dev1"
description = "Blackmagic HyperDeck control over the Ethernet Protocol (TCP 9993) plus FTP clip upload"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Lucas Romanenko" }]
dependencies = []
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Development Status :: 4 - Beta",
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/lucas-romanenko/bmdwire/tree/main/hyperdeckwire"
Issues = "https://github.com/lucas-romanenko/bmdwire/issues"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["hyperdeckwire", "hyperdeckwire.*"]
exclude = ["hyperdeckwire.tests"]
