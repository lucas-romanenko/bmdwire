<!doctype html><html><head><meta charset="utf-8">

<style>

        <div style="width:58%;height:4px;border-radius:2px;background:#8A9094"></div>
      </div>
    </div>
    <div style="font-size:clamp(28px,4.5vw,44px);font-weight:800;letter-spacing:-0.03em;line-height:1"><span style="font-weight:400;color:#9A9E9F">bmd</span>wire</div>

    <div style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:#EDEDEA;background:#141618;border:1px solid #34383C;border-radius:6px;padding:8px 14px">CPython 3.10&#8211;3.14</div>
