[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "videohubwire"
version = "0.1.0.dev1"
description = "Blackmagic Videohub Ethernet Protocol client (TCP 9990): state snapshot, routing, label editing"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Lucas Romanenko" }]
dependencies = []
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Development Status :: 4 - Beta",
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/lucas-romanenko/bmdwire/tree/main/videohubwire"
Issues = "https://github.com/lucas-romanenko/bmdwire/issues"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["videohubwire", "videohubwire.*"]
exclude = ["videohubwire.tests"]
