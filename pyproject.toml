[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "atemwire"
version = "0.14.0.dev0"
description = "Blackmagic Design ATEM switcher protocol library, a fork of Martijn Braam's upstream library"
readme = "README.md"
license = { text = "LGPL-3.0-only" }
requires-python = ">=3.10"
authors = [
    { name = "Martijn Braam and the OpenAtem contributors" },
    { name = "Lucas Romanenko" },
]
classifiers = [
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]

[project.optional-dependencies]
images = ["pillow"]
test = ["pytest", "pytest-timeout", "pillow"]

[tool.setuptools.packages.find]
include = ["atemwire", "atemwire.*"]
exclude = ["atemwire.tests"]

[tool.setuptools.package-data]
atemwire = ["py.typed", "docs/*.md"]
